name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Core and asset-structure tests (no ROS/OpenCV)
        run: python -m unittest -v test_shelf test_sim_assets
      - name: Syntax check
        run: python -m compileall -q .
